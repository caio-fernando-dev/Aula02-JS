<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/css/estilo.css">
</head>

<body>
    <main class="container">
        <div class="linha">
            <button id="verde" class="botao verde" value="g">
                <p>1</p>
            </button>
        </div>
        <div class="linha">
            <button id="azul" class="botao azul" value="b">
                <p>2</p>
            </button>
            <button vermelho class="botao vermelho" value="r">
                <p>3</p>
            </button>
        </div>
        <div class="linha">
            <button id="amarelo" class="botao amarelo" value="y">
                <p>4</p>
            </button>
        </div>

        <div class="linha">
            Turno: <span id="turno">---</span>
        </div>
        <div class="linha">
            <button onclick="comeca()">Play</button>
        </div>
        <div class="linha">
            <button onclick="finalizar()">Encerrar</button>
        </div>
    </main>

    <script src="./src/js/genius.js"></script>
</body>

</html>
